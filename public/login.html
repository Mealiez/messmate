<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Mess Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
    <div class="text-center mb-8">
      <div class="flex justify-center mb-4">
        <img src="assets/logo.png" alt="Mealiez Logo" class="h-16 w-16">
      </div>
      <h1 class="text-3xl font-bold text-gray-800 mb-2">Welcome Back</h1>
      <p class="text-gray-600">Sign in to your account</p>
    </div>

    <div id="errorAlert" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
      <span id="errorMessage"></span>
    </div>

    <form id="loginForm" class="space-y-6">
      <div>
        <label class="block text-gray-700 font-semibold mb-2">Email</label>
        <input
          type="email"
          id="email"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
          placeholder="your@email.com"
        >
      </div>

      <div>
        <label class="block text-gray-700 font-semibold mb-2">Password</label>
        <input
          type="password"
          id="password"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
          placeholder="Enter your password"
        >
      </div>

      <div>
        <label class="block text-gray-700 font-semibold mb-2">Login As</label>
        <select
          id="role"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        >
          <option value="admin">Admin</option>
          <option value="student">Student</option>
          <option value="parent">Parent</option>
        </select>
      </div>

      <button
        type="submit"
        id="loginBtn"
        class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Sign In
      </button>
    </form>

    <div class="mt-6 text-center">
      <p class="text-gray-600">
        Don't have an account?
        <a href="register.html" class="text-blue-600 font-semibold hover:underline">Register here</a>
      </p>
      <a href="index.html" class="inline-block mt-4 text-gray-500 hover:text-gray-700">
        Back to Home
      </a>
    </div>
  </div>

  <script type="module">
    import { supabase } from './supabaseConfig.js';

    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const errorAlert = document.getElementById('errorAlert');
    const errorMessage = document.getElementById('errorMessage');

    function showError(message) {
      errorMessage.textContent = message;
      errorAlert.classList.remove('hidden');
      setTimeout(() => {
        errorAlert.classList.add('hidden');
      }, 5000);
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const selectedRole = document.getElementById('role').value;

      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      try {
        const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (authError) {
          throw new Error(authError.message);
        }

        const { data: profile, error: profileError } = await supabase
          .from('user_profiles')
          .select('role')
          .eq('id', authData.user.id)
          .maybeSingle();

        if (profileError) {
          throw new Error('Failed to fetch user profile');
        }

        if (!profile) {
          throw new Error('User profile not found. Please contact administrator.');
        }

        if (profile.role !== selectedRole) {
          await supabase.auth.signOut();
          throw new Error(`You are not registered as ${selectedRole}. Please select the correct role.`);
        }

        switch (profile.role) {
          case 'admin':
            window.location.href = 'admin-dashboard.html';
            break;
          case 'student':
            window.location.href = 'student-dashboard.html';
            break;
          case 'parent':
            window.location.href = 'parent-dashboard.html';
            break;
          default:
            throw new Error('Invalid user role');
        }
      } catch (error) {
        showError(error.message);
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
