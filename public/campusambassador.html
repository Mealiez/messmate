<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Ambassador Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <nav class="bg-white shadow p-4 flex justify-between items-center">
    <div class="flex items-center">
        <img src="assets/logo.png" alt="Mealiez" class="h-8 w-8 mr-2">
        <span class="font-bold text-xl text-orange-600">CA Portal</span>
    </div>
    <a href="student-dashboard.html" class="text-gray-600 hover:text-blue-600">Back to Student Dashboard</a>
    <a href="https://drive.google.com/drive/folders/1bcR7UBD72IAh80UXwWAYxUM0E63vH43L?usp=sharing" target="_blank" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-800 hover:text-white rounded transition mb-1">
    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
    </svg>
    How it Works
</a>
  </nav>

  <main class="max-w-5xl mx-auto p-6 space-y-8">
    
    <div class="bg-white rounded-xl shadow-lg p-6 border-l-4 border-purple-500 transform hover:scale-105 transition duration-300">
    <div class="flex justify-between items-center">
        <div>
            <h3 class="text-xl font-bold text-gray-800">Your Rank</h3>
            <p class="text-gray-500 text-sm mt-1">Global Leaderboard</p>
        </div>
        <div class="bg-purple-100 p-3 rounded-full">
            <svg class="w-8 h-8 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
            </svg>
        </div>
    </div>
    <div class="mt-4">
        <h2 class="text-4xl font-bold text-gray-800" id="caRank">--</h2>
        <div class="flex items-center mt-2">
            <span class="text-gray-400 text-sm italic" id="rankPercentile">Calculating...</span>
        </div>
    </div>
</div>
        <div class="bg-white rounded-2xl p-6 shadow-lg border border-gray-100">
            <h3 class="text-gray-500 text-sm font-bold uppercase">Total Points</h3>
            <div class="text-4xl font-bold text-green-600 mt-2" id="caPoints">0</div>
            <div class="w-full bg-gray-200 rounded-full h-2.5 mt-4">
                <div class="bg-green-600 h-2.5 rounded-full" id="pointsProgress" style="width: 0%"></div>
            </div>
            <p class="text-xs text-gray-400 mt-2">Next Milestone: 500 pts</p>
        </div>

        <div class="bg-white rounded-2xl p-6 shadow-lg border border-gray-100 flex flex-col justify-center items-center text-center">
            <h3 class="font-bold text-lg mb-2">Submit New Task</h3>
            <button onclick="document.getElementById('taskModal').classList.remove('hidden')" class="bg-blue-600 text-white px-6 py-2 rounded-full font-semibold hover:bg-blue-700 transition">
                Upload Report
            </button>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow-lg p-6 border-l-4 border-blue-500 transform hover:scale-105 transition duration-300">
    <div class="flex justify-between items-center">
        <div>
            <h3 class="text-xl font-bold text-gray-800">How it Works</h3>
            <p class="text-gray-500 text-sm mt-1">Guidelines, Tutorials & Assets</p>
        </div>
        <div class="bg-blue-100 p-3 rounded-full">
            <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
            </svg>
        </div>
    </div>
    <div class="mt-4">
        <a href="https://drive.google.com/drive/folders/1bcR7UBD72IAh80UXwWAYxUM0E63vH43L?usp=sharing" target="_blank" class="block w-full text-center bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition">
            Open Drive Folder ↗
        </a>
    </div>
</div>

    <div class="bg-white rounded-2xl shadow-lg p-6">
        <h2 class="text-2xl font-bold mb-6">Recent Activity</h2>
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead>
                    <tr class="text-gray-400 border-b">
                        <th class="pb-3">Task</th>
                        <th class="pb-3">Date</th>
                        <th class="pb-3">Status</th>
                        <th class="pb-3 text-right">Points</th>
                    </tr>
                </thead>
                <tbody id="historyTable" class="text-sm">
                    </tbody>
            </table>
        </div>
    </div>
    
  </main>

  <div id="taskModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-bold">Submit Task Report</h3>
            <button onclick="document.getElementById('taskModal').classList.add('hidden')" class="text-gray-500 text-2xl">&times;</button>
        </div>
        <form id="submissionForm" class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Select Task</label>
                <select id="taskSelect" required class="w-full border rounded-lg p-2 bg-gray-50">
                    <option value="" disabled selected>Loading tasks...</option>
                </select>
                <p id="taskDesc" class="text-xs text-gray-500 mt-1 italic"></p>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Upload Proof (Screenshot/PDF)</label>
                <input type="file" id="reportFile" required class="w-full border rounded-lg p-2">
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">Submit Report</button>
        </form>
    </div>
  </div>

  <script type="module" src="./assets/campus_ambassador.js"></script>
</body>
</html>
