<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Dashboard - Mess Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <!-- Header -->
  <header class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center">
          <svg class="h-8 w-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          <span class="ml-2 text-xl font-bold text-gray-800">Mealiez Parent</span>
        </div>
        <div class="flex items-center space-x-4">
          <span class="text-gray-600">Parent Portal</span>
          <button id="logoutBtn" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">
            Logout
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Welcome Section -->
    <div class="bg-gradient-to-r from-blue-600 to-blue-700 rounded-2xl shadow-xl p-8 text-white mb-8">
      <h1 class="text-3xl font-bold mb-2">Parent Dashboard</h1>
      <p class="text-blue-100">Monitor your child's mess activities and payments</p>
    </div>

    <!-- No Students Message -->
    <div id="noStudentsMessage" class="hidden bg-yellow-100 border border-yellow-400 rounded-lg p-6 mb-8">
      <div class="flex items-center">
        <svg class="h-8 w-8 text-yellow-600 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <div>
          <p class="font-semibold text-gray-800">No students linked to your account</p>
          <p class="text-sm text-gray-600">Contact the administrator to link your child's account</p>
        </div>
      </div>
    </div>

    <!-- Students Container -->
    <div id="studentsContainer">
      <!-- Student cards will be dynamically inserted here -->
    </div>
  </main>

  <script type="module" src="./assets/parent.js"></script>
</body>
</html>
