<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <title>Register - Mess Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-MVL6Q7HZDX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-MVL6Q7HZDX');
</script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-8 my-8 relative">
    
    <div id="mainRegistrationContainer">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Registration</h1>
            <p class="text-gray-600">Create your mess account</p>
        </div>

        <div id="errorAlert" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            <span id="errorMessage"></span>
        </div>

        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 font-semibold mb-2">Register As</label>
                <select id="role" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 transition">
                    <option value="student">Student</option>
                    <option value="parent">Parent</option>
                    <option value="admin">Admin (Owner)</option>
                </select>
            </div>
            
            <div id="licenseKeyField" class="hidden">
                <label class="block text-gray-700 font-semibold mb-2">License Key</label>
                <input type="password" id="licenseKey" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-red-500">
            </div>

            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Full Name</label>
                    <input type="text" id="name" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-blue-500" placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Email</label>
                    <input type="email" id="email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-blue-500" placeholder="john@example.com">
                </div>
            </div>

            <div id="studentFields" class="space-y-4">
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Mobile Number</label>
                        <input type="tel" id="mobile" pattern="[0-9]{10}" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Room Number</label>
                        <input type="text" id="roomNo" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                    </div>
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">College Name</label>
                    <input type="text" id="college" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Mess ID (Optional)</label>
                    <input type="text" id="messId" class="w-full px-4 py-3 border border-gray-300 rounded-lg" placeholder="Leave empty if not joining a mess yet">
                </div>
                <div id="planTypeDiv" class="hidden">
                    <label class="block text-gray-700 font-semibold mb-2">Plan Type</label>
                    <select id="planType" class="w-full px-4 py-3 border border-gray-300 rounded-lg"></select>
                </div>
            </div>

            <div>
                <label class="block text-gray-700 font-semibold mb-2">Password</label>
                <input type="password" id="password" required minlength="6" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-gray-700 font-semibold mb-2">Confirm Password</label>
                <input type="password" id="confirmPassword" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-blue-500">
            </div>

            <button type="submit" id="registerBtn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition shadow-lg">
                Register
            </button>
            <p id="roleNote" class="mt-4 text-center text-red-600 font-bold text-sm hidden"></p>
        </form>

        <div class="mt-6 text-center">
            <p class="text-gray-600">Already have an account? <a href="login.html" class="text-blue-600 font-semibold hover:underline">Login here</a></p>
        </div>
    </div>

    <div id="otpModal" class="hidden absolute inset-0 bg-white rounded-2xl z-50 flex flex-col justify-center items-center p-8">
        <div class="text-center w-full max-w-sm">
            <div class="bg-green-100 p-4 rounded-full w-16 h-16 flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Verify your Email</h2>
            <p class="text-gray-600 mb-6 text-sm">We've sent a 6-digit code to <span id="otpEmailDisplay" class="font-bold"></span></p>
            
            <form id="otpForm" class="space-y-4">
                <input type="text" id="otpCode" required maxlength="6" class="w-full text-center text-2xl tracking-widest px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:ring-0 outline-none" placeholder="000000">
                <button type="submit" id="verifyBtn" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">
                    Verify & Login
                </button>
            </form>
            <p id="otpError" class="text-red-500 text-sm mt-3 hidden"></p>
        </div>
    </div>

  </div>

  <script type="module">
    import { supabase } from './supabaseConfig.js';

    // --- DOM ELEMENTS ---
    const registerForm = document.getElementById('registerForm');
    const registerBtn = document.getElementById('registerBtn');
    const errorAlert = document.getElementById('errorAlert');
    const errorMessage = document.getElementById('errorMessage');
    const roleSelect = document.getElementById('role');
    const studentFields = document.getElementById('studentFields');
    
    // OTP Elements
    const otpModal = document.getElementById('otpModal');
    const otpForm = document.getElementById('otpForm');
    const otpCodeInput = document.getElementById('otpCode');
    const verifyBtn = document.getElementById('verifyBtn');
    const otpError = document.getElementById('otpError');
    const otpEmailDisplay = document.getElementById('otpEmailDisplay');
    const mainContainer = document.getElementById('mainRegistrationContainer');

    // Admin Plan Logic
    const licenseKeyField = document.getElementById('licenseKeyField');
    const adminPlanDiv = document.createElement('div');
    adminPlanDiv.className = 'hidden mb-4';
    adminPlanDiv.innerHTML = `
        <label class="block text-gray-700 font-semibold mb-2">Choose Subscription Plan</label>
        <select id="adminPlan" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
            <option value="">Loading plans...</option>
        </select>
        <div id="planDescription" class="mt-2 text-sm text-gray-500 italic hidden"></div>
        <div id="customPlanNote" class="hidden mt-3 bg-blue-50 border border-blue-200 rounded-lg p-3">
            <p class="text-blue-700 text-sm font-semibold">📞 Custom Plan Selected</p>
            <p class="text-blue-600 text-xs mt-1">After registering, our HR team will contact you to discuss features & pricing. Your dashboard activates after payment.</p>
        </div>`;
    licenseKeyField.parentNode.insertBefore(adminPlanDiv, licenseKeyField.nextSibling);

    // Load plans dynamically from DB
    async function loadAdminPlans() {
        const select = document.getElementById('adminPlan');
        const { data: plans, error } = await supabase.from('subscription_plans').select('name, description, price_monthly').order('price_monthly', { ascending: true, nullsFirst: false });
        if (error || !plans) { select.innerHTML = '<option value="free">Free</option><option value="starter">Starter</option><option value="pro">Pro</option><option value="custom">Custom (Contact Us)</option>'; return; }
        select.innerHTML = '';
        plans.forEach(p => {
            const priceLabel = p.price_monthly === null ? 'Custom Pricing' : (p.price_monthly === 0 ? 'Free' : `₹${p.price_monthly}/mo`);
            select.innerHTML += `<option value="${p.name}" data-desc="${p.description || ''}">${p.name.charAt(0).toUpperCase() + p.name.slice(1)} – ${priceLabel}</option>`;
        });
        select.dispatchEvent(new Event('change'));
    }

    document.getElementById('adminPlan') && document.getElementById('adminPlan').addEventListener('change', (e) => {
        const opt = e.target.selectedOptions[0];
        const desc = document.getElementById('planDescription');
        const customNote = document.getElementById('customPlanNote');
        if (opt && opt.dataset.desc) { desc.textContent = opt.dataset.desc; desc.classList.remove('hidden'); } else { desc.classList.add('hidden'); }
        if (e.target.value === 'custom') { customNote.classList.remove('hidden'); } else { customNote.classList.add('hidden'); }
    });
    
    // --- VARIABLES TO HOLD TEMP DATA ---
    let pendingUserData = {};

    // --- UI TOGGLE LOGIC ---
    roleSelect.addEventListener('change', () => {
        const role = roleSelect.value;
        const mobile = document.getElementById('mobile');
        const room = document.getElementById('roomNo');
        const messId = document.getElementById('messId');
        const plan = document.getElementById('planType');
        const license = document.getElementById('licenseKey');

        // Reset
        studentFields.style.display = 'none';
        licenseKeyField.classList.add('hidden');
        adminPlanDiv.classList.add('hidden');
        document.getElementById('roleNote').classList.add('hidden');

        // Defaults
        mobile.required = false; room.required = false; messId.required = false; plan.required = false; license.required = false;

        if (role === 'student') {
            studentFields.style.display = 'block';
            mobile.required = true; room.required = true;
            document.getElementById('roleNote').textContent = "Enter Mess ID only if joining now.";
            document.getElementById('roleNote').classList.remove('hidden');
        } else if (role === 'admin') {
            licenseKeyField.classList.remove('hidden');
            adminPlanDiv.classList.remove('hidden');
            license.required = true;
            loadAdminPlans();
        }
    });
    roleSelect.dispatchEvent(new Event('change'));

    // --- FETCH PLANS LOGIC (Unchanged) ---
    const messIdInput = document.getElementById('messId');
    const planTypeSelect = document.getElementById('planType');
    const planTypeDiv = document.getElementById('planTypeDiv');
    let debounceTimer;

    messIdInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        const messId = e.target.value.trim();
        if(!messId) { planTypeDiv.classList.add('hidden'); return; }
        
        debounceTimer = setTimeout(async () => {
            planTypeDiv.classList.remove('hidden');
            planTypeSelect.innerHTML = '<option>Loading...</option>';
            const { data: plans } = await supabase.from('plans').select('name, price').eq('mess_id', messId);
            planTypeSelect.innerHTML = '<option value="" disabled selected>Select Plan</option>';
            if(plans) plans.forEach(p => {
                planTypeSelect.innerHTML += `<option value="${p.name}">${p.name} (₹${p.price})</option>`;
            });
        }, 500);
    });

    // --- PHASE 1: SIGN UP & SEND OTP ---
    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const role = roleSelect.value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            errorMessage.textContent = 'Passwords do not match';
            errorAlert.classList.remove('hidden');
            return;
        }

        registerBtn.disabled = true;
        registerBtn.textContent = 'Sending OTP...';

        try {
            // 1. Store form data temporarily in memory
            pendingUserData = {
                role, email, password,
                name: document.getElementById('name').value,
                mobile: document.getElementById('mobile').value,
                roomNo: document.getElementById('roomNo').value,
                college: document.getElementById('college').value,
                messId: document.getElementById('messId').value.trim() || null,
                planName: document.getElementById('planType').value || null,
                adminPlan: document.getElementById('adminPlan')?.value || 'free'
            };

            // 2. Supabase SignUp (Triggers Email)
            const { data, error } = await supabase.auth.signUp({ 
                email, 
                password,
                options: {
                    data: { full_name: pendingUserData.name } // Metadata
                }
            });

            if (error) throw error;

            // 3. Check if session exists (It won't if email confirm is ON)
            if (data.session) {
                // If session exists immediately, Confirmation is OFF. Just save and go.
                await createDatabaseRecords(data.user.id);
            } else {
                // 4. Confirmation ON: Show OTP Modal
                showOtpModal(email);
            }

        } catch (error) {
            console.error(error);
            errorMessage.textContent = error.message;
            errorAlert.classList.remove('hidden');
            registerBtn.disabled = false;
            registerBtn.textContent = 'Register';
        }
    });

    function showOtpModal(email) {
        otpEmailDisplay.textContent = email;
        mainContainer.classList.add('opacity-50', 'pointer-events-none'); // Disable background
        otpModal.classList.remove('hidden');
    }

    // --- PHASE 2: VERIFY OTP ---
    otpForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = otpCodeInput.value;
        const email = pendingUserData.email;

        verifyBtn.disabled = true;
        verifyBtn.textContent = 'Verifying...';
        otpError.classList.add('hidden');

        try {
            const { data, error } = await supabase.auth.verifyOtp({
                email, token, type: 'signup'
            });

            if (error) throw error;

            // --- PHASE 3: CREATE DB RECORDS ---
            // Now we have a session, RLS will allow the insert
            await createDatabaseRecords(data.user.id);

        } catch (error) {
            console.error(error);
            otpError.textContent = error.message || "Invalid OTP";
            otpError.classList.remove('hidden');
            verifyBtn.disabled = false;
            verifyBtn.textContent = 'Verify & Login';
        }
    });

    function slugify(text) {
        return text.toString().toLowerCase()
            .replace(/\s+/g, '-')           // Replace spaces with -
            .replace(/[^\w\-]+/g, '')       // Remove all non-word chars
            .replace(/\-\-+/g, '-')         // Replace multiple - with single -
            .replace(/^-+/, '')             // Trim - from start
            .replace(/-+$/, '');            // Trim - from end
    }

    // --- PHASE 4: INSERT DATA & REDIRECT ---
    async function createDatabaseRecords(userId) {
        try {
            const isCustomPlan = pendingUserData.adminPlan === 'custom';
            const paymentStatus = (pendingUserData.role === 'admin' && isCustomPlan) ? 'pending' : 'paid';

            let tenantId = null;

            // A. Handle Tenant Logic
            if (pendingUserData.role === 'admin') {
                // Create a new Mess (Tenant) for the Admin
                const messName = `${pendingUserData.name}'s Mess`;
                const { data: tenant, error: tenantError } = await supabase.from('tenants').insert({
                    name: messName,
                    slug: `${slugify(pendingUserData.name)}-${Date.now().toString().slice(-4)}`,
                    plan: pendingUserData.adminPlan || 'free'
                }).select('id').single();

                if (tenantError) throw new Error("Failed to create Mess account: " + tenantError.message);
                tenantId = tenant.id;
            } else if (pendingUserData.role === 'student' || pendingUserData.role === 'parent') {
                // Join existing Mess (Tenant) by resolving Mess ID (Admin UUID) to Tenant ID
                if (pendingUserData.messId) {
                    const { data: adminProf, error: adminErr } = await supabase
                        .from('user_profiles')
                        .select('tenant_id')
                        .eq('id', pendingUserData.messId)
                        .single();
                    
                    if (adminErr || !adminProf?.tenant_id) {
                        throw new Error("Invalid Mess ID. Please verify with your Mess Admin.");
                    }
                    tenantId = adminProf.tenant_id;
                }
            }

            if (!tenantId && pendingUserData.role !== 'hr') {
                throw new Error("Mess ID (Tenant) is required for registration.");
            }

            // B. Create User Profile
            const { error: profileError } = await supabase.from('user_profiles').insert({ 
                id: userId, 
                role: pendingUserData.role, 
                full_name: pendingUserData.name,
                subscription_plan: pendingUserData.adminPlan || 'free',
                payment_status: paymentStatus,
                tenant_id: tenantId
            });
            if (profileError) throw profileError;

            // C. Create Student Record (If Student)
            if (pendingUserData.role === 'student') {
                const { error: studentError } = await supabase.from('students').insert({
                    user_id: userId, 
                    name: pendingUserData.name, 
                    email: pendingUserData.email, 
                    mobile: pendingUserData.mobile,
                    plan_type: pendingUserData.planName, 
                    room_no: pendingUserData.roomNo, 
                    status: 'Active', 
                    mess_id: pendingUserData.messId, 
                    college: pendingUserData.college,
                    tenant_id: tenantId
                });
                if (studentError) throw studentError;
            }

            // D. Smart redirect based on plan & role
            if (pendingUserData.role === 'admin') {
                if (isCustomPlan) {
                    window.location.href = 'contact.html';
                } else {
                    alert("Registration Successful! Your Mess has been created.");
                    window.location.href = 'admin-dashboard.html';
                }
            } else if (pendingUserData.role === 'student') {
                alert("Verification Successful! Logging in...");
                window.location.href = 'student-dashboard.html';
            } else {
                window.location.href = 'parent-dashboard.html';
            }
        } catch (error) {
            console.error("DB Insert Error", error);
            alert("Account created, but profile setup failed: " + error.message);
            window.location.href = 'index.html';
        }
    }
  </script>
</body>
</html>
